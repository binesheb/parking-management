name: SmartPark XIAO firmware CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'firmware/xiao-sense/**'
      - '.github/workflows/smartpark-firmware.yml'
  push:
    branches: [main]
    paths:
      - 'firmware/xiao-sense/**'
      - '.github/workflows/smartpark-firmware.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-xiao-sense:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install PlatformIO
        run: python3 -m pip install --user platformio
      - name: Build XIAO ESP32S3 Sense firmware
        working-directory: firmware/xiao-sense
        run: python3 -m platformio run

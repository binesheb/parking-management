name: CI and Android Release
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v6
        with: { gradle-version: '9.5.0' }
      - run: gradle :app:testDebugUnitTest :app:assembleDebug :app:assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with: { name: parking-management-debug-apk, path: app/build/outputs/apk/debug/app-debug.apk }
      - uses: actions/upload-artifact@v4
        with: { name: parking-management-release-apk, path: app/build/outputs/apk/release/app-release-unsigned.apk }
  server:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: server } }
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with: { node-version: '24' }
      - run: npm install --package-lock-only
      - run: npm ci
      - run: npm test
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [android, server]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with: { name: parking-management-debug-apk, path: dist }
      - name: Calculate APK SHA-256
        id: sha
        run: echo "sha=$(sha256sum dist/app-debug.apk | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - name: Release APK
        env: { GH_TOKEN: '${{ github.token }}' }
        run: gh release create "$GITHUB_REF_NAME" dist/app-debug.apk#parking-management.apk --generate-notes
      - uses: actions/checkout@v6
        with: { ref: main }
      - name: Publish verified update manifest
        env: { APK_SHA: '${{ steps.sha.outputs.sha }}', GITHUB_REF_NAME: '${{ github.ref_name }}', GITHUB_REPOSITORY: '${{ github.repository }}' }
        run: |
          python3 - <<'PY'
          import json, os
          p='releases/android.json'
          d=json.load(open(p)) if os.path.exists(p) else {}
          d.update({'versionCode': 2, 'versionName': os.environ['GITHUB_REF_NAME'].lstrip('v'), 'apkUrl': f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/releases/latest/download/parking-management.apk", 'sha256': os.environ['APK_SHA']})
          open(p,'w').write(json.dumps(d,indent=2)+'\n')
          PY
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add releases/android.json
          git commit -m "chore(release): publish Android update manifest" || true
          git push origin main

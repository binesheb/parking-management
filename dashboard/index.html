<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Parking Management</title><style>body{font-family:system-ui;margin:24px;max-width:1100px}input,button{padding:10px;margin:4px}.cards{display:flex;gap:12px;flex-wrap:wrap}.card{padding:16px;border:1px solid #ddd;border-radius:10px;min-width:160px}table{width:100%;border-collapse:collapse;margin-top:20px}td,th{padding:8px;border-bottom:1px solid #ddd;text-align:left}</style></head><body><h1>Parking Management</h1><p>Live event log and vehicle state.</p><input id="base" placeholder="http://server:8080" value="http://localhost:8080"><button onclick="load()">Refresh</button><div class="cards"><div class="card">Events<br><b id="events">-</b></div><div class="card">Compound inside<br><b id="compound">-</b></div><div class="card">Parking inside<br><b id="parking">-</b></div></div><table><thead><tr><th>Time</th><th>Plate</th><th>Event</th><th>Device</th></tr></thead><tbody id="rows"></tbody></table><script>async function load(){const b=document.getElementById('base').value.replace(/\/$/,'');const es=await fetch(b+'/api/v1/events?limit=200').then(r=>r.json());document.getElementById('events').textContent=es.length;const state=new Map;for(const e of [...es].reverse()){const s=state.get(e.plate)||{c:false,p:false};if(e.eventType==='COMPOUND_IN')s.c=true;if(e.eventType==='COMPOUND_OUT')s.c=false;if(e.eventType==='PARKING_IN')s.p=true;if(e.eventType==='PARKING_OUT')s.p=false;state.set(e.plate,s)}document.getElementById('compound').textContent=[...state.values()].filter(x=>x.c).length;document.getElementById('parking').textContent=[...state.values()].filter(x=>x.p).length;document.getElementById('rows').innerHTML=es.map(e=>`<tr><td>${new Date(e.timestamp).toLocaleString()}</td><td><b>${e.plate}</b></td><td>${e.eventType}</td><td>${e.deviceRole}</td></tr>`).join('')}load();setInterval(load,10000)</script></body></html>

<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>Parking Management</title><style>body{font-family:system-ui;margin:24px;background:#f5f5f5}.card{background:white;padding:24px;border-radius:16px;max-width:700px;margin:auto}.stats{display:flex;gap:12px}.stat{flex:1;padding:18px;background:#eee;border-radius:12px;text-align:center}.n{font-size:42px;font-weight:700}button{padding:10px;margin:4px}</style></head><body><main class="card"><h1 id="site">Parking Management</h1><div class="stats"><div class="stat">AVAILABLE<div class="n" id="available">-</div></div><div class="stat">OCCUPIED<div class="n" id="occupied">-</div></div><div class="stat">TOTAL<div class="n" id="total">-</div></div></div><h2 id="status">Loading…</h2><h3>Recent activity</h3><div id="events"></div></main><script>async function refresh(){let s=await fetch('/api/status').then(r=>r.json());site.textContent=s.site_name+' Parking';available.textContent=s.available;occupied.textContent=s.occupied;total.textContent=s.total_capacity;status.textContent=s.status==='full'?'PARKING FULL':'PARKING AVAILABLE';let e=await fetch('/api/events').then(r=>r.json());events.innerHTML=e.reverse().map(x=>new Date(x.timestamp*1000).toLocaleTimeString()+' — '+x.type).join('<br>')}refresh();setInterval(refresh,2000)</script></body></html>
